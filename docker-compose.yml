services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: fastshop-api:latest
    container_name: fastshop-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/fastshop.db
    volumes:
      - fastshop-data:/data
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  fastshop-data:
